<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Sisso | A Birthday Story</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 40%, #142d46 0%, transparent 55%),
        radial-gradient(ellipse at 80% 85%, #12352d 0%, transparent 45%),
        #070b12;
      color: #f5f5f2;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 35px 22px;
      position: relative;
    }

    .top {
      position: absolute;
      top: 30px;
      left: 25px;
      right: 25px;
      display: flex;
      justify-content: space-between;
      color: #8dabc0;
      font-size: 10px;
      letter-spacing: 3px;
    }

    .line {
      width: 45px;
      height: 1px;
      background: #78a9a1;
      margin: 28px auto;
    }

    .small-title {
      color: #8caeb4;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(65px, 15vw, 105px);
      font-weight: 400;
      letter-spacing: 5px;
      margin: 15px 0;
      background: linear-gradient(120deg, #ffffff, #a5c5d8, #9bbcaf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #a8b7c6;
      font-size: 13px;
      line-height: 2;
      font-weight: 300;
    }

    .date-box {
      margin-top: 38px;
      padding: 18px 35px;
      border-top: 1px solid #344a5b;
      border-bottom: 1px solid #344a5b;
    }

    .date {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      letter-spacing: 4px;
      color: #dce9ed;
    }

    .date-label {
      color: #849baa;
      font-size: 9px;
      letter-spacing: 4px;
      margin-top: 8px;
    }

    .countdown {
      display: flex;
      gap: 25px;
      justify-content: center;
      margin-top: 35px;
    }

    .count-item strong {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 400;
      color: #d5e6e4;
    }

    .count-item span {
      font-size: 8px;
      color: #8299a8;
      letter-spacing: 2px;
    }

    .begin {
      margin-top: 45px;
      padding: 15px 42px;
      border: 1px solid #638c91;
      border-radius: 2px;
      background: transparent;
      color: white;
      letter-spacing: 4px;
      font-size: 10px;
      cursor: pointer;
      transition: .4s;
    }

    .begin:hover {
      background: #244b51;
      box-shadow: 0 0 25px #315d6744;
      transform: translateY(-3px);
    }

    .footer {
      position: absolute;
      bottom: 24px;
      color: #617785;
      font-size: 9px;
      letter-spacing: 3px;
    }

    .stars {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #b4d5d4;
      border-radius: 50%;
      box-shadow: 0 0 10px #a5d5d5;
      animation: glow 3s infinite alternate;
    }

    @keyframes glow {
      from { opacity: .2; }
      to { opacity: 1; }
    }

    @media(max-width: 400px) {
      .countdown { gap: 16px; }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="top">
      <span>A SPECIAL DAY</span>
      <span>05 · 12 · 2005</span>
    </div>

    <div class="small-title">A little story made for you</div>

    <div class="line"></div>

    <h1>Sisso.</h1>

    <p class="subtitle">
      Some people make ordinary days<br>
      feel a little more special.
    </p>

    <div class="date-box">
      <div class="date">05 December 2005</div>
      <div class="date-label">THE DAY YOU WERE BORN</div>
    </div>

    <div class="countdown">
      <div class="count-item">
        <strong id="days">00</strong>
        <span>DAYS</span>
      </div>

      <div class="count-item">
        <strong id="hours">00</strong>
        <span>HOURS</span>
      </div>

      <div class="count-item">
        <strong id="minutes">00</strong>
        <span>MINUTES</span>
      </div>

      <div class="count-item">
        <strong id="seconds">00</strong>
        <span>SECONDS</span>
      </div>
    </div>

    <button class="begin" onclick="startStory()">
      BEGIN THE STORY →
    </button>

    <div class="footer">
      MADE WITH CARE · JUST FOR YOU
    </div>

  </main>

  <script>
    const birthday = new Date(2026, 11, 5, 0, 0, 0);

    function updateCountdown() {
      const now = new Date();

      let target = birthday;

      if (now > target) {
        target = new Date(2027, 11, 5, 0, 0, 0);
      }

      const diff = target - now;

      document.getElementById("days").textContent =
        Math.floor(diff / 86400000).toString().padStart(2, "0");

      document.getElementById("hours").textContent =
        Math.floor((diff % 86400000) / 3600000).toString().padStart(2, "0");

      document.getElementById("minutes").textContent =
        Math.floor((diff % 3600000) / 60000).toString().padStart(2, "0");

      document.getElementById("seconds").textContent =
        Math.floor((diff % 60000) / 1000).toString().padStart(2, "0");
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    function startStory() {
      alert("The next chapter is coming... 💙");
    }
  </script>

</body>
</html>
